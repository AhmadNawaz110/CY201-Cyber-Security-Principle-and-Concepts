<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS Attacks & Hardening Masterclass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --bg-elevated: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-primary: #06b6d4; /* Cyan */
            --accent-secondary: #3b82f6; /* Blue */
            --accent-danger: #ef4444; /* Red */
            --accent-warning: #f59e0b; /* Amber */
            --accent-success: #10b981; /* Emerald */
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; scroll-behavior: smooth; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Background Effects */
        .bg-mesh {
            position: fixed; inset: 0; z-index: 0;
            background: 
                radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
            pointer-events: none;
        }
        .grid-overlay {
            position: fixed; inset: 0; z-index: 0;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        /* Slide Container */
        .slide-container {
            position: relative; z-index: 1; height: 100%; width: 100%;
            display: flex; flex-direction: column;
        }

        .slide {
            display: none; 
            flex-direction: column; 
            height: 100%; 
            width: 100%;
            padding: 2rem 3rem;
            overflow-y: auto;
            animation: fadeIn 0.4s ease-out;
        }
        
        .slide.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Navigation */
        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            padding: 0.75rem 2rem;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100;
        }

        .nav-btn {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px;
            color: var(--text-primary); padding: 0.5rem 1.5rem; cursor: pointer;
            transition: all 0.2s; font-family: 'Space Grotesk', sans-serif; font-weight: 500;
        }
        .nav-btn:hover { background: var(--accent-primary); color: var(--bg-primary); border-color: var(--accent-primary); }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; background: var(--bg-card); color: var(--text-secondary); border-color: var(--border-color); }
        .nav-btn:focus { outline: 2px solid var(--accent-secondary); outline-offset: 2px; }

        .progress-track { width: 200px; height: 4px; background: var(--bg-primary); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary)); transition: width 0.3s; }

        /* Typography */
        .section-tag { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent-primary); font-weight: 600; margin-bottom: 0.5rem; display: inline-block; background: rgba(6,182,212,0.1); padding: 0.25rem 0.75rem; border-radius: 9999px; }
        .slide-title { font-size: clamp(1.5rem, 4vw, 2.5rem); font-weight: 700; margin-bottom: 0.5rem; line-height: 1.2; background: linear-gradient(135deg, #fff 0%, #94a3b8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .slide-subtitle { font-size: 1rem; color: var(--text-secondary); margin-bottom: 2rem; font-weight: 400; }

        /* Cards & UI Elements */
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 1rem; transition: all 0.2s; }
        .card:hover { border-color: rgba(255,255,255,0.2); transform: translateY(-2px); }
        
        .danger { border-left: 3px solid var(--accent-danger); }
        .success { border-left: 3px solid var(--accent-success); }
        .warning { border-left: 3px solid var(--accent-warning); }
        .info { border-left: 3px solid var(--accent-secondary); }
        
        .win { border-left-color: #0078d4; }
        .linux { border-left-color: #fcc624; }
        .mac { border-left-color: #a2aaad; }
        .android { border-left-color: #3ddc84; }
        .ios { border-left-color: #007aff; }

        /* Code & Terminal */
        .code-block { background: #0f172a; border: 1px solid var(--border-color); border-radius: 6px; padding: 1rem; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; white-space: pre-wrap; color: #e2e8f0; position: relative; }
        .terminal { background: #000; border-radius: 6px; border: 1px solid #333; overflow: hidden; }
        .terminal-header { background: #1e1e1e; padding: 0.5rem; display: flex; gap: 0.5rem; border-bottom: 1px solid #333; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .terminal-body { padding: 1rem; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: #d4d4d4; min-height: 150px; }
        
        /* Specific styling helpers */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        
        @media (max-width: 768px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
            .slide { padding: 1rem; }
            .nav-bar { padding: 0.5rem 1rem; }
        }

        /* Diagrams */
        svg text { font-family: 'Space Grotesk', sans-serif; }
        .dfd-box { fill: rgba(30, 41, 59, 0.5); stroke: var(--text-muted); stroke-width: 1; rx: 4; }
        .dfd-process { fill: rgba(59, 130, 246, 0.1); stroke: var(--accent-secondary); }
        .dfd-trust { fill: none; stroke: var(--accent-primary); stroke-dasharray: 5 5; rx: 8; }
        .dfd-attack { fill: var(--accent-danger); }
    </style>
</head>

                        <strong class="text-gray-300">System Integrity Protection (SIP)</strong>
                        <p class="text-xs text-gray-400 mt-1">Protects system files even from root user. "Rootless" mode.</p>
                    </div>
                    <div class="card info text-sm">
                        <strong class="text-blue-400">Gatekeeper</strong>
                        <p class="text-xs text-gray-400 mt-1">Ensures only trusted software runs. Checks Developer ID and Notarization.</p>
                    </div>
                    <div class="card danger text-sm">
                        <strong class="text-red-400">Attacks:</strong>
                        <p class="text-xs text-gray-400 mt-1">XCSSET, Shlayer (macOS Malware), SIP Bypasses.</p>
                    </div>
                </div>
            </div>
        ` },

        // --- SERVER OS SECTION ---
        { id: 10, section: "Server OS", title: "Windows Server & Active Directory", subtitle: "The backbone of enterprise identity and infrastructure", type: "content", content: `
            <div class="grid-2">
                <div class="card info">
                    <h3 class="font-bold text-blue-400 mb-2">Active Directory (AD)</h3>
                    <p class="text-xs text-gray-400">Centralized authentication and authorization. Uses Kerberos, LDAP, DNS.</p>
                    <div class="mt-2 p-2 bg-gray-800 rounded text-xs">
                        <span class="text-red-400 font-bold">Golden Ticket Attack:</span>
                        <span class="text-gray-300"> Compromise KRBTGT hash to create persistent admin tickets.</span>
                    </div>
                </div>
                <div class="card linux">
                    <h3 class="font-bold text-yellow-400 mb-2">Linux Servers</h3>
                    <p class="text-xs text-gray-400">Power web servers, databases, and cloud backends.</p>
                    <div class="mt-2 p-2 bg-gray-800 rounded text-xs">
                        <span class="text-red-400 font-bold">SSH Attacks:</span>
                        <span class="text-gray-300"> Brute force, Key theft, Agent forwarding abuse.</span>
                    </div>
                </div>
                <div class="card danger col-span-2 mt-2">
                    <h3 class="font-bold text-red-400 mb-2">Critical Vulnerability Examples</h3>
                    <div class="grid-2 gap-2 text-xs">
                        <div><strong>ZeroLogon (CVE-2020-1472):</strong> Elevation of privilege in AD.</div>
                        <div><strong>Shellshock:</strong> Bash remote code execution via environment variables.</div>
                    </div>
                </div>
            </div>
        ` },

        // --- MOBILE OS SECTION ---
        { id: 11, section: "Mobile OS", title: "Android Security Model", subtitle: "Linux foundation with Java/Application framework", type: "content", content: `
            <div class="grid-2">
                <div class="flex justify-center items-center">
                    <svg viewBox="0 0 300 300" class="w-48">
                        <rect x="30" y="30" width="240" height="30" fill="#1e293b" stroke="#3ddc84"/>
                        <text x="150" y="50" text-anchor="middle" fill="#3ddc84" font-size="10">System Apps</text>
                        <rect x="30" y="65" width="240" height="30" fill="#1e293b" stroke="#3ddc84"/>
                        <text x="150" y="85" text-anchor="middle" fill="#fff" font-size="10">Java API Framework</text>
                        <rect x="30" y="100" width="240" height="30" fill="#1e293b" stroke="#3ddc84"/>
                        <text x="150" y="120" text-anchor="middle" fill="#fff" font-size="10">Native Libraries / ART</text>
                        <rect x="30" y="135" width="240" height="40" fill="#0f172a" stroke="#f59e0b"/>
                        <text x="150" y="160" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="bold">HAL (Hardware Abstraction)</text>
                        <rect x="30" y="180" width="240" height="40" fill="#0f172a" stroke="#ef4444"/>
                        <text x="150" y="205" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="bold">Linux Kernel</text>
                    </svg>
                </div>
                <div class="space-y-2">
                    <div class="card android">
                        <h3 class="font-bold text-green-400">Sandboxing</h3>
                        <p class="text-xs text-gray-400">Each app runs as unique UID. Permissions defined at install/runtime.</p>
                    </div>
                    <div class="card danger">
                        <h3 class="font-bold text-red-400">Attack Vectors</h3>
                        <ul class="list-disc list-inside text-xs text-gray-400 mt-1">
                            <li>APK Repackaging (Tampering)</li>
                            <li>Rooting Exploits</li>
                            <li>Intent Sniffing/Injection</li>
                            <li>Malware via 3rd Party Stores</li>
                        </ul>
                    </div>
                </div>
            </div>
        ` },
        { id: 12, section: "Mobile OS", title: "iOS Security Model", subtitle: "Walled garden, secure enclave, and strict isolation", type: "content", content: `
            <div class="grid-2">
                <div class="space-y-2">
                    <div class="card ios">
                        <h3 class="font-bold text-blue-400">Secure Enclave</h3>
                        <p class="text-xs text-gray-400">Hardware-based key manager for Touch ID, Face ID, and encryption keys. Isolated from main processor.</p>
                    </div>
                    <div class="card success">
                        <h3 class="font-bold text-emerald-400">App Store Review</h3>
                        <p class="text-xs text-gray-400">Strict vetting process. Code signing mandatory. No side-loading (except enterprise certs).</p>
                    </div>
                    <div class="card danger">
                        <h3 class="font-bold text-red-400">Exploits</h3>
                        <p class="text-xs text-gray-400 mt-1">Checkra1n (Bootrom exploit), Pegasus (Zero-click iMessage exploit).</p>
                    </div>
                </div>
                <div class="flex justify-center items-center">
                     <svg viewBox="0 0 300 300" class="w-48">
                        <rect x="40" y="40" width="220" height="220" rx="20" fill="none" stroke="#334155" stroke-width="2"/>
                        <text x="150" y="80" text-anchor="middle" fill="#64748b" font-size="12">Hardware</text>
                        <rect x="60" y="100" width="180" height="140" rx="10" fill="none" stroke="#007aff" stroke-width="2"/>
                        <text x="150" y="130" text-anchor="middle" fill="#007aff" font-size="12">Secure Enclave</text>
                        <rect x="80" y="150" width="140" height="70" rx="5" fill="none" stroke="#10b981" stroke-width="2"/>
                        <text x="150" y="190" text-anchor="middle" fill="#10b981" font-size="12">iOS Kernel</text>
                    </svg>
                </div>
            </div>
        ` },

        // --- IoT & EMBEDDED ---
        { id: 13, section: "IoT/Embedded", title: "Embedded Systems & IoT", subtitle: "Security constraints in resource-constrained environments", type: "content", content: `
            <div class="grid-2">
                <div class="card warning">
                    <h3 class="font-bold text-amber-400">Characteristics</h3>
                    <ul class="list-disc list-inside text-xs text-gray-400 mt-2">
                        <li>Real-Time Operating Systems (RTOS)</li>
                        <li>Monolithic Firmware (No MMU)</li>
                        <li>Long deployment lifecycle (10-20 yrs)</li>
                        <li>Infrequent/No patching mechanism</li>
                        <li>Hardcoded credentials common</li>
                    </ul>
                </div>
                <div class="card danger">
                    <h3 class="font-bold text-red-400">Major Risks</h3>
                    <ul class="list-disc list-inside text-xs text-gray-400 mt-2">
                        <li>No ASLR/DEP protections</li>
                        <li>Physically accessible interfaces (JTAG/UART)</li>
                        <li>Unencrypted updates</li>
                        <li>Botnet recruitment (Mirai)</li>
                    </ul>
                </div>
            </div>
            <div class="mt-4 p-4 bg-gray-800 rounded-lg">
                <strong class="text-red-400">Case Study: Mirai Botnet</strong>
                <p class="text-xs text-gray-400 mt-1">Infected routers/cameras via default Telnet credentials. Used for massive DDoS attacks (1 Tbps+).</p>
            </div>
        ` },
        { id: 14, section: "Specialized OS", title: "ICS/SCADA & Network OS", subtitle: "Securing critical infrastructure", type: "content", content: `
            <div class="grid-2">
                <div class="card danger">
                    <h3 class="font-bold text-red-400">ICS/SCADA (Industrial Control)</h3>
                    <p class="text-xs text-gray-400 mt-2">Systems controlling power grids, water plants, factories.</p>
                    <ul class="list-disc list-inside text-xs text-gray-400 mt-2">
                        <li><strong>Protocols:</strong> Modbus, DNP3, IEC 61850 (Often cleartext)</li>
                        <li><strong>OS:</strong> Custom embedded or Windows XP/7 based HMIs.</li>
                        <li><strong>Threat:</strong> Stuxnet (targeted centrifuges), Triton (Safety systems).</li>
                    </ul>
                </div>
                <div class="card info">
                    <h3 class="font-bold text-blue-400">Network OS (Cisco IOS, JunOS)</h3>
                    <p class="text-xs text-gray-400 mt-2">Operating systems for routers and switches.</p>
                    <ul class="list-disc list-inside text-xs text-gray-400 mt-2">
                        <li><strong>Architecture:</strong> Proprietary monolithic kernel.</li>
                        <li><strong>Management:</strong> SSH, SNMP, Console.</li>
                        <li><strong>Threat:</strong> SNMP community string brute force, Cisco IKEv1 vulnerability.</li>
                    </ul>
                </div>
            </div>
        ` },

        // --- CLOUD & CONTAINERS ---
        { id: 15, section: "Cloud/Container", title: "Hypervisors & Virtualization", subtitle: "Security in virtualized environments", type: "content", content: `
            <div class="grid-2 items-center">
                <div>
                    <svg viewBox="0 0 400 300" class="w-full">
                        <rect x="10" y="260" width="380" height="30" fill="#10b981" opacity="0.2" stroke="#10b981"/>
                        <text x="200" y="280" text-anchor="middle" fill="#10b981" font-size="12">Hardware</text>
                        
                        <!-- Type 1 -->
                        <rect x="10" y="180" width="185" height="70" fill="#ef4444" opacity="0.2" stroke="#ef4444"/>
                        <text x="102" y="200" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="bold">Hypervisor (Type 1)</text>
                        <rect x="20" y="210" width="50" height="30" fill="#1e293b" stroke="#fff"/>
                        <text x="45" y="230" text-anchor="middle" fill="#fff" font-size="8">VM</text>
                        <rect x="80" y="210" width="50" height="30" fill="#1e293b" stroke="#fff"/>
                        <text x="105" y="230" text-anchor="middle" fill="#fff" font-size="8">VM</text>
                        
                        <!-- Type 2 -->
                        <rect x="205" y="180" width="185" height="70" fill="#3b82f6" opacity="0.2" stroke="#3b82f6"/>
                        <text x="297" y="200" text-anchor="middle" fill="#3b82f6" font-size="10" font-weight="bold">Host OS</text>
                        <rect x="215" y="210" width="165" height="30" fill="#f59e0b" opacity="0.2" stroke="#f59e0b"/>
                        <text x="297" y="230" text-anchor="middle" fill="#f59e0b" font-size="10">Hypervisor (Type 2)</text>
                    </svg>
                </div>
                <div class="space-y-2">
                    <div class="card danger text-sm">
                        <strong class="text-red-400">Type 1 (Bare Metal)</strong>
                        <p class="text-xs text-gray-400 mt-1">ESXi, Hyper-V, Xen. Runs directly on hardware. Smaller attack surface.</p>
                    </div>
                    <div class="card info text-sm">
                        <strong class="text-blue-400">Type 2 (Hosted)</strong>
                        <p class="text-xs text-gray-400 mt-1">VirtualBox, VMware Workstation. Runs on top of Host OS. Larger attack surface.</p>
                    </div>
                    <div class="card warning text-sm">
                        <strong class="text-amber-400">Threat: VM Escape</strong>
                        <p class="text-xs text-gray-400 mt-1">Breaking out of a guest VM to execute code on the host/hypervisor (e.g., VENOM vulnerability).</p>
                    </div>
                </div>
            </div>
        ` },
        { id: 16, section: "Cloud/Container", title: "Container Security (Docker/K8s)", subtitle: "Isolation via OS virtualization", type: "content", content: `
            <div class="grid-2">
                <div class="terminal">
                    <div class="terminal-header"><div class="dot" style="background:#ef4444"></div><div class="dot" style="background:#f59e0b"></div><div class="dot" style="background:#10b981"></div></div>
                    <div class="terminal-body">
<span style="color:#10b981">$</span> docker run --privileged -it alpine sh
<span style="color:#f59e0b">Warning:</span> Running privileged container.
<span style="color:#10b981">/ #</span> fdisk -l
<span style="color:#ef4444">Disk /dev/sda: 50 GiB</span> ...
<span style="color:#94a3b8"># Host disk visible inside container!</span>
                    </div>
                </div>
                <div class="space-y-2">
                    <div class="card info text-sm">
                        <strong class="text-blue-400">Namespaces</strong>
                        <p class="text-xs text-gray-400 mt-1">Isolates process view (PID, NET, MNT, UTS).</p>
                    </div>
                    <div class="card info text-sm">
                        <strong class="text-blue-400">Cgroups</strong>
                        <p class="text-xs text-gray-400 mt-1">Limits resource usage (CPU, RAM).</p>
                    </div>
                    <div class="card danger text-sm">
                        <strong class="text-red-400">Container Escape</strong>
                        <p class="text-xs text-gray-400 mt-1">Running as root or --privileged allows access to host resources. Exploiting runc, Dirty Pipe.</p>
                    </div>
                </div>
            </div>
        ` },

        // --- SECTION 3: ATTACK LANDSCAPE ---
        { id: 17, section: "Attack Landscape", title: "The OS Attack Lifecycle", subtitle: "How adversaries compromise operating systems", type: "content", content: `
            <div class="flex flex-col justify-center h-full">
                <div class="flex justify-between items-center text-center text-xs">
                    <div class="flex flex-col items-center"><div class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center font-bold text-gray-300">1</div><span class="mt-1 text-gray-400">Recon</span></div>
                    <svg width="50" height="10"><path d="M0 5 L40 5" stroke="#ef4444" stroke-width="2" marker-end="url(#arrRed)"/></svg>
                    <div class="flex flex-col items-center"><div class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center font-bold text-gray-300">2</div><span class="mt-1 text-gray-400">Exploit</span></div>
                    <svg width="50" height="10"><path d="M0 5 L40 5" stroke="#ef4444" stroke-width="2" marker-end="url(#arrRed)"/></svg>
                    <div class="flex flex-col items-center"><div class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center font-bold text-gray-300">3</div><span class="mt-1 text-gray-400">Persistence</span></div>
                    <svg width="50" height="10"><path d="M0 5 L40 5" stroke="#ef4444" stroke-width="2" marker-end="url(#arrRed)"/></svg>
                    <div class="flex flex-col items-center"><div class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center font-bold text-gray-300">4</div><span class="mt-1 text-gray-400">PrivEsc</span></div>
                    <svg width="50" height="10"><path d="M0 5 L40 5" stroke="#ef4444" stroke-width="2" marker-end="url(#arrRed)"/></svg>
                    <div class="flex flex-col items-center"><div class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center font-bold text-gray-300">5</div><span class="mt-1 text-gray-400">Lateral</span></div>
                </div>
                <defs><marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/></marker></defs>
                
                <div class="grid-3 mt-8 gap-4">
                    <div class="card danger text-xs"><strong>Malware</strong><br/>Ransomware, Spyware, Rootkits</div>
                    <div class="card danger text-xs"><strong>Exploits</strong><br/>Buffer Overflow, Zero-Days</div>
                    <div class="card danger text-xs"><strong>Living off the Land</strong><br/>Powershell, WMI, Bash</div>
                </div>
            </div>
        ` },
        { id: 18, section: "Attack Types", title: "Privilege Escalation", subtitle: "Moving from User to SYSTEM/root", type: "content", content: `
            <div class="grid-2">
                <div class="card win">
                    <h3 class="font-bold text-blue-400 mb-2">Windows Vertical Escalation</h3>
                    <ul class="text-xs text-gray-400 space-y-1">
                        <li><strong>Unquoted Service Paths:</strong> "C:\\Program Files\\App..."</li>
                        <li><strong>Service Permissions:</strong> Weak ACL on service binary</li>
                        <li><strong>DLL Hijacking:</strong> Placing malicious DLL in search path</li>
                        <li><strong>Token Impersonation:</strong> SeImpersonatePrivilege abuse (PrintSpoofer)</li>
                    </ul>
                </div>
                <div class="card linux">
                    <h3 class="font-bold text-yellow-400 mb-2">Linux Vertical Escalation</h3>
                    <ul class="text-xs text-gray-400 space-y-1">
                        <li><strong>SUID Binaries:</strong> Executables running with owner perms</li>
                        <li><strong>Sudo Misconfiguration:</strong> NOPASSWD entries</li>
                        <li><strong>Cron Jobs:</strong> Writable scripts run by root</li>
                        <li><strong>Kernel Exploits:</strong> DirtyCow, DirtyPipe</li>
                    </ul>
                </div>
            </div>
        ` },
        { id: 19, section: "Attack Types", title: "Memory Corruption Attacks", subtitle: "Exploiting software bugs to control execution", type: "content", content: `
            <div class="grid-2 items-center">
                <div class="card danger text-sm">
                    <h3 class="font-bold text-red-400 mb-2">Buffer Overflow</h3>
                    <p class="text-xs text-gray-400 mb-2">Writing data past the end of a buffer, overwriting return addresses or function pointers.</p>
                    <div class="code-block text-xs">
int main() {
    char buffer[10];
    strcpy(buffer, user_input); <span style="color:#ef4444">// Vulnerable!</span>
}
                    </div>
                </div>
                <div>
                    <svg viewBox="0 0 300 200" class="w-full">
                        <rect x="10" y="10" width="280" height="40" fill="#1e293b" stroke="#64748b"/>
                        <text x="150" y="35" text-anchor="middle" fill="#fff" font-size="10">Local Variables</text>
                        <rect x="10" y="55" width="280" height="40" fill="#3b82f6" opacity="0.5" stroke="#3b82f6"/>
                        <text x="150" y="80" text-anchor="middle" fill="#fff" font-size="10">Return Address (Overwritten)</text>
                        <rect x="10" y="100" width="280" height="40" fill="#1e293b" stroke="#64748b"/>
                        <text x="150" y="125" text-anchor="middle" fill="#fff" font-size="10">Function Arguments</text>
                        <path d="M300 120 L300 60 L290 60" stroke="#ef4444" stroke-width="2" fill="none"/>
                        <text x="285" y="90" fill="#ef4444" font-size="10" transform="rotate(-90, 285, 90)">Overflow</text>
                    </svg>
                </div>
            </div>
            <div class="mt-4 card success text-sm">
                <strong class="text-emerald-400">Mitigations:</strong>
                <span class="text-xs text-gray-400 ml-2">ASLR (Randomization), DEP/NX (Non-Executable Memory), Stack Canaries, CFG (Control Flow Guard).</span>
            </div>
        ` },
        { id: 20, section: "Attack Types", title: "Rootkits & Bootkits", subtitle: "Hiding presence deep within the system", type: "content", content: `
            <div class="grid-2">
                <div class="card warning">
                    <h3 class="font-bold text-amber-400">Rootkit Types</h3>
                    <ul class="text-xs text-gray-400 mt-2 space-y-1">
                        <li><strong>User-mode:</strong> DLL injection, API hooking. Easier to detect.</li>
                        <li><strong>Kernel-mode:</strong> Loadable Kernel Module (LKM) or Driver. Hooks system calls directly.</li>
                        <li><strong>Hypervisor:</strong> Runs in Ring -1. Virtually invisible to OS.</li>
                    </ul>
                </div>
                <div class="card danger">
                    <h3 class="font-bold text-red-400">Bootkits</h3>
                    <p class="text-xs text-gray-400 mt-2">Infects Master Boot Record (MBR) or UEFI bootloader. Loads before the OS kernel, compromising Secure Boot chain.</p>
                </div>
            </div>
            <div class="mt-4 p-3 bg-gray-800 rounded text-xs">
                <strong>Detection:</strong> Integrity checking, Cross-view detection (comparing internal API results with raw disk scans), TPM-based measured boot.
            </div>
        ` },

        // --- SECTION 4: ATTACK VECTORS ---
        { id: 21, section: "Attack Vectors", title: "Common Attack Vectors", subtitle: "Entry points into the operating system", type: "content", content: `
            <div class="grid-2 gap-4">
                <div class="card danger">
                    <h3 class="font-bold text-red-400 text-sm">Network Services</h3>
                    <p class="text-xs text-gray-400 mt-1">Open ports (RDP, SMB, SSH). Exploited via remote code execution (RCE) vulnerabilities.</p>
                </div>
                <div class="card warning">
                    <h3 class="font-bold text-amber-400 text-sm">Phishing & Social Engineering</h3>
                    <p class="text-xs text-gray-400 mt-1">Tricking users into executing malicious code or revealing credentials.</p>
                </div>
                <div class="card info">
                    <h3 class="font-bold text-blue-400 text-sm">Supply Chain</h3>
                    <p class="text-xs text-gray-400 mt-1">Compromised updates (SolarWinds), malicious dependencies (NPM), or pre-installed malware.</p>
                </div>
                <div class="card danger">
                    <h3 class="font-bold text-red-400 text-sm">Physical Access</h3>
                    <p class="text-xs text-gray-400 mt-1">Live CD/USB booting, DMA attacks (Thunderbolt/PCMCIA), Hardware implanting.</p>
                </div>
            </div>
        ` },

        // --- SECTION 6: DFDS ---
        { id: 24, section: "Data Flow", title: "DFD: Desktop Environment", subtitle: "Trust boundaries and attack surfaces", type: "content", content: `
             <svg viewBox="0 0 600 300" class="w-full h-full p-4">
                <!-- Trust Boundary -->
                <rect x="50" y="50" width="400" height="200" class="dfd-trust"/>
                <text x="250" y="40" fill="#06b6d4" font-size="12" text-anchor="middle">System Boundary (Ring 0/3)</text>

                <!-- External Entity -->
                <rect x="500" y="100" width="80" height="40" fill="#334155" stroke="#64748b"/>
                <text x="540" y="125" text-anchor="middle" fill="#fff" font-size="10">Network</text>

    let currentSlide = 1;
    const totalSlides = slidesData.length;
    const container = document.getElementById('slideContainer');
    const progress = document.getElementById('progress');
    const counter = document.getElementById('counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function initSlides() {
        slidesData.forEach(slide => {
            const slideEl = document.createElement('div');
            slideEl.className = 'slide';
            slideEl.id = `slide-${slide.id}`;
            
            let html = '';
            
            // Header
            if (slide.type !== 'title') {
                html += `<div class="mb-4"><span class="section-tag">${slide.section}</span><h1 class="slide-title">${slide.title}</h1><p class="slide-subtitle">${slide.subtitle}</p></div>`;
            }

            // Content
            html += `<div class="flex-1 overflow-y-auto">${slide.content}</div>`;
            
            slideEl.innerHTML = html;
            container.appendChild(slideEl);
        });
        updateView();
    }

    function changeSlide(direction) {
        currentSlide += direction;
        if (currentSlide < 1) currentSlide = 1;
        if (currentSlide > totalSlides) currentSlide = totalSlides;
        updateView();
    }

    function updateView() {
        // Update visibility
        document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
        const active = document.getElementById(`slide-${currentSlide}`);
        if (active) active.classList.add('active');

        // Update Nav
        const percent = (currentSlide / totalSlides) * 100;
        progress.style.width = `${percent}%`;
        counter.innerText = `${currentSlide} / ${totalSlides}`;
        prevBtn.disabled = currentSlide === 1;
        nextBtn.disabled = currentSlide === totalSlides;
    }

    // Keyboard Navigation
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === ' ') changeSlide(1);
        if (e.key === 'ArrowLeft') changeSlide(-1);
    });
